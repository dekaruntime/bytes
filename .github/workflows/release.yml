name: Release stdlib tarball to R2

# Publishing is automated (dekaruntime/deka#511): merging a PR that bumps
# "version" in deka.json is the whole ritual. The shared reusable workflow
# in dekaruntime/deka tags the merge commit, packs, uploads to R2, verifies
# the object by ranged GET, and fires a repository_dispatch at
# dekaruntime/website. Hand-cut tags and direct pushes to main do not
# publish; a version-bump PR must pass the install + typecheck gate below
# before merge.
#
# Keep this file a thin caller: all logic lives in the reusable workflow so
# the ~19 stdlib repos cannot drift apart.

on:
  pull_request:
    branches: [main]
    paths: ['deka.json']
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wiring_check_version:
        description: 'Throwaway version for a pre-release wiring check (e.g. 0.0.0-wiring-check)'
        required: true
        type: string

# contents: write lets the reusable workflow cut the release tag from the
# merge commit. PRs from forks are downgraded to read-only by GitHub.
permissions:
  contents: write

concurrency:
  group: stdlib-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: dekaruntime/deka/.github/workflows/stdlib-release.yml@main
    with:
      wiring_check_version: ${{ github.event.inputs.wiring_check_version }}
    secrets: inherit
